name: Duo Build

on:
  workflow_dispatch:
  push:
    branches: ['duo/**']
    tags: ['duo-v*']

permissions:
  contents: read

concurrency:
  group: duo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sync:worker && git diff --exit-code worker/src/shared
      - run: npm run verify

  build:
    needs: verify
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            command: npm run desktop:build
            files: dist/*.zip
          - os: windows-latest
            platform: windows-x64
            command: npm run desktop:build:win
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Check native desktop
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build Rust desktop
        run: ${{ matrix.command }}
      - name: Archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          version=$(node -p 'require("./package.json").version')
          ditto -c -k --sequesterRsrc --keepParent "desktop/src-tauri/target/release/bundle/macos/Token Monitor Duo.app" "dist/Token-Monitor-Duo-${version}-mac-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: duo-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
